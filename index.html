<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TaskFlow - Todo List</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- Header -->
    <header class="header">
      <div>
        <h1 id="appTitle">TaskFlow</h1>
        <p id="appSubtitle">Organize your day, one task at a time.</p>
      </div>

      <button id="languageBtn" class="language-btn">
        বাংলা
      </button>
    </header>

    <!-- Add Task Section -->
    <section class="task-form card">

      <div class="input-group">
        <label id="titleLabel" for="taskTitle">Task Title</label>
        <input
          type="text"
          id="taskTitle"
          placeholder="Enter your task..."
        >
      </div>

      <div class="form-row">

        <div class="input-group">
          <label id="priorityLabel" for="taskPriority">Priority</label>

          <select id="taskPriority">
            <option value="High">High</option>
            <option value="Medium" selected>Medium</option>
            <option value="Low">Low</option>
          </select>
        </div>

        <div class="input-group">
          <label id="dueDateLabel" for="taskDate">Due Date</label>
          <input type="date" id="taskDate">
        </div>

        <button id="addTaskBtn" class="add-btn">
          + Add Task
        </button>

      </div>

    </section>

    <!-- Search and Filters -->
    <section class="toolbar">

      <div class="search-box">
        <span>⌕</span>
        <input
          type="text"
          id="searchInput"
          placeholder="Search tasks..."
        >
      </div>

      <div class="filters">
        <button class="filter-btn active" data-filter="all" id="allBtn">
          All
        </button>

        <button class="filter-btn" data-filter="active" id="activeBtn">
          Active
        </button>

        <button class="filter-btn" data-filter="completed" id="completedBtn">
          Completed
        </button>
      </div>

    </section>

    <!-- Task Summary -->
    <section class="task-summary">
      <span id="remainingText">0 tasks remaining</span>

      <button id="clearCompletedBtn" class="clear-btn">
        Clear completed
      </button>
    </section>

    <!-- Task List -->
    <main>
      <div id="taskList" class="task-list"></div>

      <div id="emptyState" class="empty-state">
        <div class="empty-icon">✓</div>
        <h2 id="emptyTitle">No tasks found</h2>
        <p id="emptyMessage">
          Add a task to get started.
        </p>
      </div>
    </main>

  </div>

  <script src="script.js"></script>

</body>
</html>
